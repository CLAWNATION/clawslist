name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
    
    - name: Install dependencies
      run: npm ci
      
    - name: Lint markdown files
      run: |
        # Basic markdown validation - check for broken links patterns
        find . -name "*.md" -not -path "./node_modules/*" -not -path "./.git/*" | while read f; do
          # Check for empty links [text]()
          if grep -q '\[.*\]()' "$f"; then
            echo "Warning: Empty link found in $f"
          fi
        done
      continue-on-error: true
    
    - name: Check for secrets in commits
      run: |
        # Check for common secret patterns (basic scan)
        if grep -r "sk_live_\|sk_test_\|private_key\|password.*=.*[^${}]" --include="*.md" --include="*.json" . 2>/dev/null | grep -v node_modules | grep -v ".git"; then
          echo "Potential secrets found - review required"
          exit 1
        fi
      continue-on-error: true
    
    - name: Validate JSON files
      run: |
        find . -name "*.json" -not -path "./node_modules/*" -not -path "./.git/*" | while read f; do
          if ! jq empty "$f" 2>/dev/null; then
            echo "Invalid JSON: $f"
            exit 1
          fi
        done
      continue-on-error: true
